plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.rb958'
version = '1.1.0'
description = 'A small kernel onto which modules are grafted as JAR plugins, hot-loaded and talking through signals.'

// Compiled for Java 17 whatever JDK runs the build (17 or 21 in CI).
java {
    withJavadocJar()
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

repositories {
    mavenCentral()
}

// No runtime dependency. 1.0 pulled javax.xml.bind 2.3 and jakarta.xml.bind 3.0
// together; the registry is now read and written with the JDK's own XML API.
dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

javadoc {
    options.encoding = 'UTF-8'
    options.addBooleanOption('Xdoclint:none', true)
}

test {
    useJUnitPlatform()
    testLogging {
        events = ['passed', 'failed', 'skipped']
        exceptionFormat = 'full'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'rkernel'
            pom {
                name = 'rkernel'
                description = project.description
                url = 'https://github.com/Rb958/rkernel'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'rb958'
                        name = 'Richie Akawa'
                        email = 'richiebayless@gmail.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Rb958/rkernel.git'
                    developerConnection = 'scm:git:git@github.com:Rb958/rkernel.git'
                    url = 'https://github.com/Rb958/rkernel'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'sonatype'
            def release = 'https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/'
            def snapshot = 'https://s01.oss.sonatype.org/content/repositories/snapshots/'
            url = version.endsWith('SNAPSHOT') ? snapshot : release
            credentials {
                username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
            }
        }
    }
}

// Signing is only required for publication; a plain build or test never needs a key.
signing {
    required = { gradle.taskGraph.hasTask('publish') }
    def key = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
    def pass = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')
    if (key) {
        useInMemoryPgpKeys(key, pass)
    }
    sign publishing.publications.mavenJava
}
